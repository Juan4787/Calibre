[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freight-audit"
version = "0.1.0"
description = "Auditorías locales, deterministas y explicables de cargos de transporte"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "openpyxl>=3.1.5,<4", "xlrd>=2.0.1,<3", "defusedxml>=0.7.1,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "httpx>=0.28,<1", "build>=1.2,<2", "xlwt>=1.3,<2"]

[project.scripts]
freight-audit = "freight_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freight_audit = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/freight_audit"]
