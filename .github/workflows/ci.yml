name: CI (Fast Checks & Invariants)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier1-pr:
    name: Tier 1 - PR & Fast Functional Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-browser.lock
          pip install --no-deps -e .
          playwright install --with-deps chromium

      - name: Run Tier 1 Verification (Lints, Types, Matrix, Tests, Build)
        run: bash scripts/run_ci_tier.sh pr

      - name: Preserve browser evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-browser-evidence
          path: output/playwright/
          retention-days: 7

  tier2-ci:
    name: Tier 2 - Full Semantic & Invariant Verification
    needs: tier1-pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-browser.lock
          pip install --no-deps -e .
          playwright install --with-deps chromium

      - name: Run Tier 2 Verification (Hypothesis CI, Invariants, Reconciliation)
        run: bash scripts/run_ci_tier.sh ci
