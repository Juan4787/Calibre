name: Scale 100k Gate Verification

on:
  workflow_dispatch:
    inputs:
      all_exports:
        description: "Run all exports (XLSX, Bundle, HTML) at 100k"
        required: true
        type: boolean
        default: true
      runner_label:
        description: "Linux runner label; 16 GiB or more required for the full pipeline"
        required: true
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  scale-100k:
    name: Scale 100k Isolated Single-Run (capacity checked)
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.lock -r requirements-browser.lock
          pip install --no-deps -e .

      - name: Capture Runner Hardware & Memory Telemetry
        run: |
          echo "================================================================="
          echo "RUNNER HARDWARE AND MEMORY ENVIRONMENT"
          echo "================================================================="
          echo "--- Memory Overview (free -h) ---"
          free -h
          echo ""
          echo "--- Detailed /proc/meminfo ---"
          cat /proc/meminfo | grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree'
          echo ""
          echo "--- Available CPU Cores (nproc) ---"
          nproc
          echo ""
          echo "--- Disk Space (df -h) ---"
          df -h
          echo "================================================================="

      - name: Require actual host and cgroup memory before generating 100k
        run: |
          python - <<'PY'
          from pathlib import Path

          minimum = 16 * 1024**3
          meminfo = Path('/proc/meminfo').read_text()
          available_kib = int(next(line.split()[1] for line in meminfo.splitlines() if line.startswith('MemAvailable:')))
          limits = []
          for name in ('/sys/fs/cgroup/memory.max', '/sys/fs/cgroup/memory/memory.limit_in_bytes'):
              path = Path(name)
              if path.exists():
                  raw = path.read_text().strip()
                  if raw.isdigit():
                      limits.append(int(raw))
          effective_limit = min(limits) if limits else None
          print(f'Host available: {available_kib / 1024**2:.2f} GiB; cgroup limit: {effective_limit}', flush=True)
          if available_kib * 1024 < minimum or (effective_limit is not None and effective_limit < minimum):
              raise SystemExit('RESOURCE_LIMIT: 100k full pipeline requires a runner with at least 16 GiB available and permitted; no benchmark started')
          PY

      - name: Execute 100k Isolated Benchmark Run
        run: |
          EXPORT_FLAG=""
          if [ "${{ github.event.inputs.all_exports }}" = "true" ]; then
            EXPORT_FLAG="--all-exports"
          fi

          python output/e2e/platform_scale/benchmark_runner.py \
            --sizes 100000 \
            --reps 1 \
            --skip-curve \
            $EXPORT_FLAG \
            --max-child-rss 12000 \
            --min-host-mem 4000

      - name: Display Benchmark Summary JSON
        if: always()
        run: |
          if [ -f output/e2e/platform_scale/scale/100000/summary.json ]; then
            echo "================================================================="
            echo "100K SUMMARY.JSON"
            echo "================================================================="
            cat output/e2e/platform_scale/scale/100000/summary.json
          fi

      - name: Upload Scale 100k Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-100k-results
          path: output/e2e/platform_scale/scale/
