name: Nightly (Adversarial & Mutation Defense Sweep)

on:
  schedule:
    - cron: "0 3 * * *"  # Run daily at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier3-nightly:
    name: Tier 3 - Nightly Adversarial & Mutation Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-browser.lock
          pip install --no-deps -e .
          playwright install --with-deps chromium

      - name: Run Tier 3 Nightly Suite (Hypothesis 1000, Mutations, Faults, Adversarial Corpus)
        run: bash scripts/run_ci_tier.sh nightly

      - name: Preserve detector and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-qa-evidence
          path: |
            output/ci/
            output/playwright/
          retention-days: 7
