name: Release (Packaged Wheel Certification & Publish Gate)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  tier4-release:
    name: Tier 4 - Release Gate & Clean-Room Wheel Certification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (Clean fetch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Execute Tier 4 Release Gate (Build, Hashes, Isolated Clean-Room Install, Smoke)
        run: bash scripts/run_ci_tier.sh release

      - name: Upload Certified Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          if-no-files-found: error
