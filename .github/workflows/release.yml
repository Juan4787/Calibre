name: Release (Checks and Packaged Artifacts)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  tier4-release:
    name: Tier 4 - Release Checks and Clean-Room Wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (Clean fetch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build and verification tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-browser.lock
          pip install --no-deps -e .
          playwright install --with-deps chromium

      - name: Execute Tier 4 Release Gate (Build, Hashes, Isolated Clean-Room Install, Smoke)
        run: bash scripts/run_ci_tier.sh release

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-evidence
          path: output/playwright/
          retention-days: 7

      - name: Upload Checked Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          if-no-files-found: error
